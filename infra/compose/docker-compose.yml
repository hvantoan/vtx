name: vtx

services:
  postgres:
    image: postgres:17-alpine
    container_name: vtx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtx_user
      POSTGRES_PASSWORD: vtx_password
      POSTGRES_DB: vtx_platform
    ports:
      - "${VTX_POSTGRES_PORT:-49432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init-dbs.sql:/docker-entrypoint-initdb.d/01-init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtx_user -d vtx_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: vtx-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=vtx_user
      - POSTGRES_PWD=vtx_password
      - POSTGRES_SEEDS=postgres
      - BIND_ON_IP=0.0.0.0
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    ports:
      - "${VTX_TEMPORAL_PORT:-49233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: vtx-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${VTX_WEB_PORT:-49030}
    ports:
      - "${VTX_TEMPORAL_UI_PORT:-49234}:8080"

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - PORT=49080
      - API_HOST=0.0.0.0
      - APP_ENV=development
      - DATABASE_URL=postgres://vtx_user:vtx_password@postgres:5432/vtx_platform?sslmode=disable
      - TEMPORAL_HOST_PORT=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=vtx-task-queue
      - API_AUTH_TOKEN=vtx-dev-secret-token-change-in-production
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_API_EMAIL=${JIRA_API_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_PROJECT_ALLOWLIST=${JIRA_PROJECT_ALLOWLIST}
      - JIRA_READY_TO_DEV_STATUS_ID=${JIRA_READY_TO_DEV_STATUS_ID}
      - JIRA_SITE_ID=${JIRA_SITE_ID}
      - GATEWAY_INTERNAL_AUTH_TOKEN=${GATEWAY_INTERNAL_AUTH_TOKEN}
    ports:
      - "${VTX_API_PORT:-49080}:49080"

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - backend
    # Allowlist envsubst: only the four vars below are substituted into
    # templates — every other $token stays an nginx runtime variable.
    environment:
      - WEBHOOK_PATH_SECRET_PRIMARY=${WEBHOOK_PATH_SECRET_PRIMARY}
      - WEBHOOK_PATH_SECRET_SECONDARY=${WEBHOOK_PATH_SECRET_SECONDARY:-}
      - GATEWAY_INTERNAL_AUTH_TOKEN=${GATEWAY_INTERNAL_AUTH_TOKEN}
      - VTX_API_PORT=49080
      - NGINX_ENVSUBST_FILTER=^(WEBHOOK_PATH_SECRET_|GATEWAY_INTERNAL_AUTH_TOKEN|VTX_API_PORT)
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${VTX_GATEWAY_PORT:-49443}:443"


  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: vtx-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${VTX_API_PORT:-49080}
      - NEXT_PUBLIC_APP_ENV=development
    ports:
      - "${VTX_WEB_PORT:-49030}:49030"

networks:
  default:
    name: vtx_net
volumes:
  postgres_data:
