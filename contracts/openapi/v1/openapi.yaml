openapi: 3.1.0
info:
  title: VTX Platform API
  description: Core backend API for VTX Autonomous Development Pipeline platform.
  version: 1.0.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:49080
    description: Local development server
paths:
  /health:
    get:
      summary: Liveness Probe
      description: Returns 200 OK if the HTTP server process is live and responsive.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Server is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Readiness Probe
      description: Checks connectivity to critical dependencies (PostgreSQL, Temporal Server).
      operationId: getReady
      security: []
      responses:
        '200':
          description: All dependencies healthy and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: One or more dependencies are unhealthy or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/system/status:
    get:
      summary: System Status
      description: Returns detailed platform runtime metrics, version, and component status.
      operationId: getSystemStatus
      security: []
      responses:
        '200':
          description: System status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
  /api/v1/events:
    get:
      summary: Real-Time SSE Stream
      description: Establishes a Server-Sent Events stream for platform events, task updates, and system metrics. Requires Bearer authentication.
      operationId: subscribeEvents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: SSE stream opened successfully
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of newline-delimited SSE event frames
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workers:
    get:
      summary: Worker Status
      description: Returns the status of active Temporal workers and agent runtime instances.
      operationId: getWorkerStatus
      security: []
      responses:
        '200':
          description: Worker status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatusResponse'
  /api/v1/integrations/jira/webhooks:
    post:
      summary: Jira Webhook Intake
      description: >
        Receives Jira Cloud `jira:issue_updated` administrative webhook events,
        deduplicates status transitions on
        (jira_site_id, issue_id, changelog_id, target_status_id), and records
        exactly one durable execution intent + outbox event per unique
        transition whose `to` status ID is a configured start status for the
        issue's project (per-project `start_status_ids` in the Jira intake
        config — transitions to any other target are `invalid_transition`
        receipts, never intents). Accepted events publish outbox payload
        `execution_intent.created.v1`: event_id, intent_id, issue_id,
        issue_key, jira_site_id, changelog_id, target_status_id, occurred_at,
        occurred_at_source, correlation_id. Reachable only through the Nginx
        webhook gateway, which injects the internal Bearer token after
        validating the URL path secret. Public exposure is prohibited.
      operationId: intakeJiraWebhook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraWebhookEnvelope'
      responses:
        '200':
          description: Transition already received (idempotent duplicate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '202':
          description: >
            Event acknowledged. Either accepted for processing, or ignored
            without penalty (non-status event, out-of-scope project, stale
            transition, missing changelog id). A 202 is always returned for
            ignorable traffic so Jira Cloud never auto-disables the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Wrong Content-Type or malformed JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid internal gateway token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload exceeds the 256 KiB ingress limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Structurally valid but unprocessable: the transition target is not
            a configured start status for the issue's project
            (invalid_transition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            Transient upstream failure (Jira API or database). No inbox row is
            persisted; Jira's webhook redelivery performs the retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/registry/runs/{run_id}:
    get:
      summary: Get a task run
      description: >
        Returns one task run. Callers authenticate with a registry actor token
        (scheduler, orchestrator, operator, policy); the actor is derived from
        the token, never from the request. The registry surface is internal:
        the production gateway does not proxy it.
      operationId: getRegistryRun
      security:
        - RegistryBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryRun'
        '401':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
  /api/v1/registry/runs/{run_id}/events:
    get:
      summary: List a run's audit events
      description: >
        Append-only audit trail in ascending version order. Pagination is a
        cursor on `version` (never `created_at`): two events may share a
        timestamp, and the version is the transition's identity.
      operationId: listRegistryRunEvents
      security:
        - RegistryBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/AfterVersion'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of audit events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistryRunEvent'
                  next_cursor:
                    type: integer
                    description: Last version on this page; absent when the page is not full
                    example: 4
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthorized'
  /api/v1/registry/runs/{run_id}/transitions:
    post:
      summary: Apply a run transition
      description: >
        The only mutation path for a run. The actor comes from the bearer
        token; a body `actor` that differs from the authenticated principal is
        rejected with 403 rather than ignored. Errors are typed: not_found 404;
        stale_version, stale_lease, already_terminal, invalid_transition,
        conflict_active_run and stage_not_operational 409; forbidden 403.
        `stage_not_operational` marks a contract-valid hop whose downstream
        system does not exist yet in phase 1 — the registry refuses instead of
        forging completion evidence.
      operationId: transitionRegistryRun
      security:
        - RegistryBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, action]
              properties:
                expected_version:
                  type: integer
                  minimum: 0
                  description: Optimistic concurrency token; must equal the current version
                expected_lease_epoch:
                  type: integer
                  minimum: 0
                  description: Required for lease-guarded actions (begin, advance, complete, schedule_retry)
                action:
                  type: string
                  enum: [begin, advance, complete, block, resume, schedule_retry, retry_due, cancel, fail]
                reason:
                  type: string
                  maxLength: 500
                  description: Sanitized (whitespace-flattened, bounded) before it reaches the audit row
                metadata:
                  type: object
                  description: Opaque JSON stored on the audit row
                actor:
                  type: string
                  description: >
                    Accepted only to reject impersonation: if present and not the
                    authenticated principal, the request is 403.
            example:
              expected_version: 0
              action: block
              reason: waiting on operator
      responses:
        '200':
          description: The run after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryRun'
        '400':
          $ref: '#/components/responses/RegistryBadRequest'
        '401':
          $ref: '#/components/responses/RegistryUnauthorized'
        '403':
          description: The token's actor may not perform this action, or the body claimed another actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
        '409':
          description: >
            Conflict: stale_version, stale_lease, already_terminal,
            invalid_transition, conflict_active_run or stage_not_operational.
            Nothing is written when this is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/registry/tasks/{site_id}/{issue_id}:
    get:
      summary: Get a registry task by Jira identity
      description: Resolves (jira_site_id, jira_issue_id) to the registry task.
      operationId: getRegistryTask
      security:
        - RegistryBearer: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryTask'
        '401':
          $ref: '#/components/responses/RegistryUnauthorized'
        '404':
          $ref: '#/components/responses/RegistryNotFound'
