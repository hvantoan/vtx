openapi: 3.1.0
info:
  title: VTX Platform API
  description: Core backend API for VTX Autonomous Development Pipeline platform.
  version: 1.0.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:49080
    description: Local development server
paths:
  /health:
    get:
      summary: Liveness Probe
      description: Returns 200 OK if the HTTP server process is live and responsive.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Server is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Readiness Probe
      description: Checks connectivity to critical dependencies (PostgreSQL, Temporal Server).
      operationId: getReady
      security: []
      responses:
        '200':
          description: All dependencies healthy and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: One or more dependencies are unhealthy or unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/system/status:
    get:
      summary: System Status
      description: Returns detailed platform runtime metrics, version, and component status.
      operationId: getSystemStatus
      security: []
      responses:
        '200':
          description: System status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
  /api/v1/events:
    get:
      summary: Real-Time SSE Stream
      description: Establishes a Server-Sent Events stream for platform events, task updates, and system metrics. Requires Bearer authentication.
      operationId: subscribeEvents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: SSE stream opened successfully
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of newline-delimited SSE event frames
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workers:
    get:
      summary: Worker Status
      description: Returns the status of active Temporal workers and agent runtime instances.
      operationId: getWorkerStatus
      security: []
      responses:
        '200':
          description: Worker status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStatusResponse'
  /api/v1/integrations/jira/webhooks:
    post:
      summary: Jira Webhook Intake
      description: >
        Receives Jira Cloud `jira:issue_updated` administrative webhook events,
        deduplicates status transitions on
        (jira_site_id, issue_id, changelog_id, target_status_id), and records
        exactly one durable execution intent + outbox event per unique
        transition to "Ready To Develope". Reachable only through the Nginx
        webhook gateway, which injects the internal Bearer token after
        validating the URL path secret. Public exposure is prohibited.
      operationId: intakeJiraWebhook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraWebhookEnvelope'
      responses:
        '200':
          description: Transition already received (idempotent duplicate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '202':
          description: >
            Event acknowledged. Either accepted for processing, or ignored
            without penalty (non-status event, out-of-scope project, stale
            transition, missing changelog id). A 202 is always returned for
            ignorable traffic so Jira Cloud never auto-disables the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          description: Wrong Content-Type or malformed JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid internal gateway token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload exceeds the 256 KiB ingress limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Structurally valid envelope that cannot be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            Transient upstream failure (Jira API or database). No inbox row is
            persisted; Jira's webhook redelivery performs the retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or API Token
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - uptime_seconds
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: number
          example: 124.5
    DependencyCheck:
      type: object
      required:
        - status
        - latency_ms
      properties:
        status:
          type: string
          enum: [up, down, degraded]
        latency_ms:
          type: number
          example: 2.4
        error:
          type:
            - string
            - "null"
    ReadyResponse:
      type: object
      required:
        - status
        - timestamp
        - dependencies
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/DependencyCheck'
            temporal:
              $ref: '#/components/schemas/DependencyCheck'
    SystemStatusResponse:
      type: object
      required:
        - version
        - commit
        - environment
        - go_version
        - goroutines
      properties:
        version:
          type: string
          example: 1.0.0
        commit:
          type: string
          example: a1b2c3d
        environment:
          type: string
          example: development
        go_version:
          type: string
          example: go1.25.7
        goroutines:
          type: integer
          example: 14
        uptime_seconds:
          type: number
          example: 3600.0
    WorkerStatusResponse:
      type: object
      required:
        - status
        - workers
      properties:
        status:
          type: string
          example: healthy
        workers:
          type: array
          items:
            type: object
            required:
              - id
              - queue
              - status
            properties:
              id:
                type: string
                example: temporal-worker-default
              queue:
                type: string
                example: vtx-task-queue
              status:
                type: string
                enum: [running, idle, stopped]
              active_workflows:
                type: integer
                example: 0
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: unauthorized
        message:
          type: string
          example: Invalid or missing authorization header
    JiraWebhookEnvelope:
      type: object
      description: Jira Cloud administrative webhook payload (jira:issue_updated)
      properties:
        timestamp:
          type: integer
          format: int64
        webhookEvent:
          type: string
          example: jira:issue_updated
        issue:
          type: object
          properties:
            id:
              type: string
              example: "10011"
            key:
              type: string
              example: VTX-2
            self:
              type: string
              format: uri
            fields:
              type: object
              properties:
                project:
                  type: object
                  properties:
                    key:
                      type: string
        changelog:
          type: object
          properties:
            id:
              type: string
              example: "20001"
            items:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  fieldId:
                    type: string
                  to:
                    type: string
                    description: Target status ID when field is "status"
    WebhookResponse:
      type: object
      required:
        - request_id
        - disposition
      properties:
        request_id:
          type: string
          description: Correlation ID from the request middleware
          example: b3f9c2a1d4e5f607
        disposition:
          type: string
          enum: [accepted, duplicate, ignored_stale, ignored_scope, invalid_transition]
          example: accepted
        intent_id:
          type: string
          format: uuid
          description: Present for accepted and duplicate dispositions
          example: 3f6a2c94-0d1b-4e58-9a7c-12df34ab56cd
