name: VTX CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      web: ${{ steps.changes.outputs.web }}
      agent: ${{ steps.changes.outputs.agent }}
      contracts: ${{ steps.changes.outputs.contracts }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'contracts/**'
              - 'infra/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            agent:
              - 'apps/agent-runtime/**'
              - 'contracts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
            infra:
              - 'infra/**'

  boundary-check:
    name: Monorepo Boundary & Conformance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run boundary check script
        run: ./infra/scripts/check-boundaries.sh

  backend-ci:
    name: Backend CI (Go)
    needs: [filter, boundary-check]
    if: needs.filter.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/backend/go.mod'
          cache-dependency-path: 'apps/backend/go.sum'
      - name: Go Vet
        run: make vet
      - name: Go Test
        run: make test-backend
      - name: Go Build
        run: make build-backend

  web-ci:
    name: Web CI (Next.js)
    needs: [filter, boundary-check]
    if: needs.filter.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Web
        run: make typecheck-web
      - name: Lint Web
        run: make lint-web
      - name: Test Web
        run: make test-web
      - name: Build Web
        run: make build-web

  agent-ci:
    name: Agent Runtime CI (Node.js)
    needs: [filter, boundary-check]
    if: needs.filter.outputs.agent == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Agent Runtime
        run: make typecheck-agent
      - name: Lint Agent Runtime
        run: make lint-agent
      - name: Test Agent Runtime
        run: make test-agent
      - name: Build Agent Runtime
        run: make build-agent

  contract-conformance:
    name: Contract Conformance
    needs: [filter, boundary-check]
    if: needs.filter.outputs.contracts == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenAPI Spec
        run: npx @redocly/cli lint contracts/openapi/v1/openapi.yaml
      - name: Validate JSON Schemas
        run: |
          node -e "
            const fs = require('fs');
            JSON.parse(fs.readFileSync('contracts/agent/v1/agent-ipc.json'));
            JSON.parse(fs.readFileSync('contracts/events/v1/events.json'));
            console.log('JSON schemas are valid syntax.');
          "

  backend-integration:
    name: Backend Integration (Migrations + JT-01..21 E2E)
    needs: [filter, boundary-check]
    if: needs.filter.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/backend/go.mod'
          cache-dependency-path: 'apps/backend/go.sum'

      - name: Install goose + sqlc (pinned)
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Prepare e2e env + gateway certs
        run: |
          infra/compose/nginx/gen_certs.sh
          cat > ci.env <<EOF
          PORT=49080
          API_AUTH_TOKEN=ci-public-token
          JIRA_BASE_URL=https://vtxsolution.atlassian.net
          JIRA_API_EMAIL=ci@example.com
          JIRA_API_TOKEN=ci-token
          JIRA_SITE_ID=vtxsolution.atlassian.net
          GATEWAY_INTERNAL_AUTH_TOKEN=ci-internal-gateway-token-0000000000000000
          REGISTRY_ACTOR_SCHEDULER_TOKEN=ci-registry-scheduler-token-000000000000000
          REGISTRY_ACTOR_ORCHESTRATOR_TOKEN=ci-registry-orchestrator-token-00000000000
          REGISTRY_ACTOR_OPERATOR_TOKEN=ci-registry-operator-token-00000000000000000
          REGISTRY_ACTOR_POLICY_TOKEN=ci-registry-policy-token-0000000000000000000
          WEBHOOK_PATH_SECRET_PRIMARY=cisecretprimary00000000000000000000000000000000000
          WEBHOOK_PATH_SECRET_SECONDARY=
          # Host ports are bound ephemerally (0): fixed ports in the
          # 32768-60999 range collide with runner-side outbound connections
          # (ip_local_port_range), which caused a "port already allocated"
          # failure on postgres. Actual ports are resolved via
          # `docker compose port` after the stack is up (see below).
          VTX_GATEWAY_PORT=0
          VTX_API_PORT=0
          VTX_POSTGRES_PORT=0
          VTX_TEMPORAL_PORT=0
          VTX_TEMPORAL_UI_PORT=0
          VTX_WEB_PORT=0
          EOF
          export JT_ENV_FILE=$PWD/ci.env
          echo "JT_ENV_FILE=$PWD/ci.env" >> "$GITHUB_ENV"

      - name: Start e2e stack (postgres + backend + gateway + jira-stub)
        run: |
          COMPOSE=(docker compose --env-file ci.env
            -f infra/compose/docker-compose.yml
            -f infra/compose/docker-compose.e2e.yml --profile e2e)
          "${COMPOSE[@]}" up -d --build backend gateway jira-stub postgres
          # Wait for postgres health before migrating.
          for i in $(seq 60); do
            docker exec vtx-postgres pg_isready -U vtx_user -d vtx_platform >/dev/null 2>&1 && break
            sleep 1
          done
          # Resolve the ephemeral postgres host port (VTX_POSTGRES_PORT=0 in
          # ci.env) for the migration DSN. ci.env stays at 0 so later compose
          # calls keep the same spec; the JT harness re-resolves api/gateway
          # ports itself after every `up` (ephemeral bindings change on
          # container recreate).
          JT_PG_PORT=$("${COMPOSE[@]}" port postgres 5432 | head -1 | awk -F: '{print $NF}' | tr -d '[:space:]')
          [ -n "$JT_PG_PORT" ] || { echo "FATAL: could not resolve postgres port"; exit 1; }
          echo "JT_PG_PORT=$JT_PG_PORT" >> "$GITHUB_ENV"
          echo "postgres bound to host port $JT_PG_PORT"

      - name: Migrations up / down-to-0 / re-up on clean DB
        run: |
          DSN="postgres://vtx_user:vtx_password@localhost:${JT_PG_PORT}/vtx_platform?sslmode=disable"
          goose -dir apps/backend/db/migrations postgres "$DSN" up
          goose -dir apps/backend/db/migrations postgres "$DSN" down-to 0
          goose -dir apps/backend/db/migrations postgres "$DSN" up

      - name: sqlc generate drift check
        run: |
          cd apps/backend && sqlc generate
          git diff --exit-code internal/persistence/db

      - name: Registry precheck + integration tests (TR-11/18/24, I-01..I-05)
        run: |
          DSN="postgres://vtx_user:vtx_password@localhost:${JT_PG_PORT}/vtx_platform?sslmode=disable"
          mkdir -p tests/evidence
          {
            echo "# VTX-3 registry migration precheck"
            echo "# sha: ${GITHUB_SHA}  $(date -Is)"
            psql "$DSN" -X -c "SELECT version_id FROM goose_db_version ORDER BY version_id DESC LIMIT 1"
            psql "$DSN" -X -c "SELECT 'tasks='||(SELECT count(*) FROM tasks)||' task_events='||(SELECT count(*) FROM task_events)||' agent_sessions='||(SELECT count(*) FROM agent_sessions)||' execution_intents='||(SELECT count(*) FROM execution_intents)||' outbox_events='||(SELECT count(*) FROM outbox_events)||' outbox_pending='||(SELECT count(*) FROM outbox_events WHERE published_at IS NULL)"
            psql "$DSN" -X -c "SELECT conrelid::regclass||' -> '||confrelid::regclass AS fk_into_bootstrap FROM pg_constraint WHERE contype='f' AND confrelid::regclass::text IN ('tasks','task_events','agent_sessions')"
          } | tee tests/evidence/registry-migration-precheck.log
          # The suite runs goose down-to 0 / up-to 3 / up and seeds VTX-2 rows;
          # it ends with the schema at head, so the JT harness below is unaffected.
          TEST_DATABASE_URL="$DSN" make test-integration | tee tests/evidence/registry-integration.log

      - name: JT-01..21 harness (20 concurrent × 2 replicas, real nginx)
        run: ./infra/scripts/test-jira-webhook.sh | tee jt-evidence.log

      - name: VTX-3 registry outbox harness (dispatcher replicas, DLQ, backfill)
        run: ./infra/scripts/test-registry-outbox.sh | tee registry-outbox-evidence.log

      - name: Render prod overlay — backend must have no ports (JT-16 evidence)
        run: |
          docker compose --env-file ci.env \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.prod.yml config > prod-compose-render.yml
          # Direct assertion: backend service block has no ports key.
          python3 - <<'PY'
          import re, sys
          txt = open('prod-compose-render.yml').read()
          m = re.search(r'^  backend:.*?(?=^  \w)', txt, re.S | re.M)
          assert m, "backend service missing"
          assert 'ports:' not in m.group(0), "backend must not publish ports in prod"
          print("prod overlay verified: backend has no ports")
          PY

      - name: Upload JT evidence (SHA-stamped)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jt-evidence-${{ github.sha }}
          path: |
            jt-evidence.log
            prod-compose-render.yml
          if-no-files-found: warn

      - name: Upload VTX-3 registry evidence (SHA-stamped)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-evidence-${{ github.sha }}
          path: |
            registry-outbox-evidence.log
            tests/evidence/registry-migration-precheck.log
            tests/evidence/registry-integration.log
            tests/evidence/vtx-3-compatibility-matrix.md
            tests/evidence/vtx-3-tr-matrix.md
          if-no-files-found: warn

  gate:
    name: Required Status Checks Gate
    needs:
      - filter
      - boundary-check
      - backend-ci
      - backend-integration
      - web-ci
      - agent-ci
      - contract-conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pipeline gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BOUNDARY_RES: ${{ needs.boundary-check.result }}
          BACKEND_RES: ${{ needs.backend-ci.result }}
          INTEG_RES: ${{ needs.backend-integration.result }}
          BACKEND_TRIGGER: ${{ needs.filter.outputs.backend }}
          WEB_RES: ${{ needs.web-ci.result }}
          WEB_TRIGGER: ${{ needs.filter.outputs.web }}
          AGENT_RES: ${{ needs.agent-ci.result }}
          AGENT_TRIGGER: ${{ needs.filter.outputs.agent }}
          CONTRACT_RES: ${{ needs.contract-conformance.result }}
          CONTRACT_TRIGGER: ${{ needs.filter.outputs.contracts }}
        run: |
          echo "Evaluating CI Status Checks Gate..."
          echo "Event: $EVENT_NAME"
          echo "Boundary Check Result: $BOUNDARY_RES"
          echo "Backend Result: $BACKEND_RES (Triggered: $BACKEND_TRIGGER)"
          echo "Integration Result: $INTEG_RES (Triggered: $BACKEND_TRIGGER)"
          echo "Web Result: $WEB_RES (Triggered: $WEB_TRIGGER)"
          echo "Agent Result: $AGENT_RES (Triggered: $AGENT_TRIGGER)"
          echo "Contract Result: $CONTRACT_RES (Triggered: $CONTRACT_TRIGGER)"

          FAILED=0

          check_job() {
            local name="$1"
            local res="$2"
            local trigger="$3"

            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "❌ $name failed with status $res"
              FAILED=1
            elif [ "$res" = "skipped" ]; then
              if [ "$EVENT_NAME" = "push" ] || [ "$trigger" = "true" ]; then
                echo "❌ $name was skipped abnormally when it was required to run"
                FAILED=1
              else
                echo "ℹ️  $name safely skipped (no path changes)"
              fi
            elif [ "$res" = "success" ]; then
              echo "✅ $name passed"
            else
              echo "❌ $name returned unexpected status: $res"
              FAILED=1
            fi
          }

          if [ "$BOUNDARY_RES" != "success" ]; then
            echo "❌ boundary-check is mandatory and must succeed (status: $BOUNDARY_RES)"
            FAILED=1
          else
            echo "✅ boundary-check passed"
          fi

          check_job "backend-ci" "$BACKEND_RES" "$BACKEND_TRIGGER"
          check_job "backend-integration" "$INTEG_RES" "$BACKEND_TRIGGER"
          check_job "web-ci" "$WEB_RES" "$WEB_TRIGGER"
          check_job "agent-ci" "$AGENT_RES" "$AGENT_TRIGGER"
          check_job "contract-conformance" "$CONTRACT_RES" "$CONTRACT_TRIGGER"

          if [ $FAILED -ne 0 ]; then
            echo "❌ Pipeline check failed."
            exit 1
          fi

          echo "✅ All required checks passed or were safely skipped per path rules."
          exit 0
